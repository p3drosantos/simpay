name: Check

on:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install
        run: pnpm ci

      - name: Create env test
        run: |
          echo "DATABASE_URL=postgresql://user:password@localhost:5433/simpay_test" >> .env.test

      - name: Lint
        run: pnpm run lint

      - name: Prettier
        run: pnpm run prettier:check

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build
